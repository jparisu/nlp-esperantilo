name: docs-preview

# Publishes a live preview of the documentation for every pull request, so the
# rendered site can be reviewed before merging.
#
# The preview goes to a subdirectory of the `gh-pages` branch:
#   https://jparisu.github.io/nlp-esperantilo/pr-preview/pr-<number>/
# The production site at the root of that branch is never touched, so nothing
# reaches the public front page until the pull request is merged. When the pull
# request is closed or merged, the preview is deleted again.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:

  preview:
    name: Build and publish preview
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        if: github.event.action != 'closed'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        if: github.event.action != 'closed'
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      # This is also the pull request gate: a broken link or a bad
      # configuration fails the check before anything is published.
      - name: Build site
        if: github.event.action != 'closed'
        env:
          # Canonical links, the sitemap and the language switcher must point at
          # the preview, not at the production site.
          SITE_URL: >-
            https://jparisu.github.io/nlp-esperantilo/pr-preview/pr-${{ github.event.number }}/
        run: mkdocs build --strict --site-dir site

      # Pull requests opened from a fork get a read-only token and cannot
      # publish. They are still built above, they just get no preview URL.
      - name: Deploy preview
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          # deploy on open/reopen/synchronize, remove on close.
          action: auto
