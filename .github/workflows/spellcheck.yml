name: spellcheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  codespell:
    name: Spell check
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install codespell
        run: |
          python -m pip install --upgrade pip
          pip install codespell

      # Configuration (which paths to skip and which words to accept) lives in
      # .codespellrc, so that local runs and CI behave identically.
      - name: Run codespell
        run: codespell
